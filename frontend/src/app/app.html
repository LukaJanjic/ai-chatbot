<div class="chat-container">
  <h1>AI Chatbot</h1>

  <div class="input-area">
    <textarea
      [(ngModel)]="message"
      (keydown)="onKeydown($event)"
      placeholder="Unesite poruku..."
      rows="3"
    ></textarea>
    <button (click)="send()" [disabled]="loading()">
      {{ loading() ? 'Čeka se...' : 'Pošalji' }}
    </button>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (reply()) {
    <div class="reply">
      <p>{{ reply() }}</p>
    </div>
  }
</div>
